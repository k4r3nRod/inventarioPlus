spring.application.name=InventarioPlus

#Puerto del servidor Spring Boot
server.port=8080

# ================================
# CONFIGURACIÓN DE BASE DE DATOS MYSQL WORKBENCH
# ================================

# URL de conexión a MySQL (ajusta el puerto si es diferente)
spring.datasource.url=jdbc:mysql://localhost:3306/inventario_plus?useSSL=false&serverTimezone=America/Mexico_City&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true

# Credenciales de MySQL Workbench (ajusta según tu configuración)
spring.datasource.username=root
spring.datasource.password=root

# Driver de MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ================================
# CONFIGURACIÓN DE JPA/HIBERNATE
# ================================

# Estrategia para el esquema de BD: create, create-drop, update, validate, none
spring.jpa.hibernate.ddl-auto=update

# Mostrar consultas SQL en consola
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dialecto de MySQL (actualizado para evitar warnings)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Configuraciones adicionales de rendimiento
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Pool de conexiones HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000

#Configuración JSP
spring.mvc.view.prefix=/WEB-INF/views/layout/
spring.mvc.view.suffix=.jsp

#Deshabilitar Thymeleaf completamente para usar JSP
spring.thymeleaf.enabled=false
spring.thymeleaf.check-template-location=false

#Habilitar logging detallado para JSP
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.servlet.view=DEBUG